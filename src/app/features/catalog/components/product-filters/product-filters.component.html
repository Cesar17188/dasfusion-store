<aside class="w-full space-y-6">
  <!-- Header / Reset -->
  <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
    <h3 class="text-sm font-bold uppercase tracking-wider text-zinc-100">Filtros</h3>
    <button
      type="button"
      (click)="resetFilters()"
      class="text-xs text-blue-400 hover:text-blue-300 font-medium"
    >
      Limpiar todo
    </button>
  </div>

  <!-- Categories -->
  <div class="space-y-3">
    <h4 class="text-xs font-semibold uppercase text-zinc-400">Categorías</h4>
    <div class="flex flex-col gap-1.5">
      @for (cat of categories(); track cat) {
        <button
          type="button"
          (click)="onCategorySelect(cat)"
          class="flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold text-left transition cursor-pointer"
          [class.bg-[#aec7f7]]="selectedCategory === cat"
          [class.text-[#0a1b33]]="selectedCategory === cat"
          [class.shadow-sm]="selectedCategory === cat"
          [class.text-[#e3e2e6]]="selectedCategory !== cat"
          [class.hover:bg-zinc-800]="selectedCategory !== cat"
          [class.hover:text-white]="selectedCategory !== cat"
        >
          <span>{{ cat }}</span>
        </button>
      }
    </div>
  </div>

  <!-- Brands -->
  <div class="space-y-3 pt-4 border-t border-zinc-800">
    <h4 class="text-xs font-semibold uppercase text-zinc-400">Marcas</h4>
    <div class="space-y-2 max-h-48 overflow-y-auto pr-2">
      @for (brand of brands(); track brand) {
        <label class="flex items-center gap-2 text-xs text-zinc-300 hover:text-white cursor-pointer select-none">
          <input
            type="checkbox"
            [checked]="selectedBrands.includes(brand)"
            (change)="onBrandToggle(brand)"
            class="h-4 w-4 rounded border-zinc-700 bg-zinc-800 text-blue-600 focus:ring-blue-500 focus:ring-offset-zinc-900"
          />
          <span>{{ brand }}</span>
        </label>
      }
    </div>
  </div>

  <!-- Price Range -->
  <div class="space-y-3 pt-4 border-t border-zinc-800">
    <h4 class="text-xs font-semibold uppercase text-zinc-400">Rango de Precio ($)</h4>
    <div class="flex items-center gap-2">
      <input
        type="number"
        placeholder="Min"
        [(ngModel)]="minPrice"
        (change)="onPriceChange()"
        class="w-1/2 bg-zinc-900 border border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-blue-500"
      />
      <span class="text-zinc-500">-</span>
      <input
        type="number"
        placeholder="Max"
        [(ngModel)]="maxPrice"
        (change)="onPriceChange()"
        class="w-1/2 bg-zinc-900 border border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-blue-500"
      />
    </div>
  </div>

  <!-- In Stock Switch -->
  <div class="pt-4 border-t border-zinc-800">
    <label class="flex items-center gap-2 text-xs text-zinc-300 hover:text-white cursor-pointer select-none">
      <input
        type="checkbox"
        [checked]="inStockOnly"
        (change)="onStockToggle()"
        class="h-4 w-4 rounded border-zinc-700 bg-zinc-800 text-blue-600 focus:ring-blue-500"
      />
      <span>Solo productos en stock</span>
    </label>
  </div>
</aside>
